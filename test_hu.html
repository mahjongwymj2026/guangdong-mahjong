<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>test</title></head><body>
<script src="js/mahjong.js"></script>
<script>
  var hand = ['D3','D3','D3','D5','D7','T1','T1','T5','T5','W1','W1'];
  var melds = [{type:'peng', tile:'D9', tiles:['D9','D9','D9'], fromSeat:1}];
  var ghost = 'W1';
  document.write('<p>手牌（含副露D9x3）: ' + hand.join(',') + ' + D9x3</p>');
  document.write('<p>鬼牌: ' + ghost + '</p>');
  document.write('<p>checkWin(手牌, 鬼): ' + window.mj.checkWin(hand, ghost) + '</p>');
  document.write('<p>checkWin(手牌, 鬼, 副露): ' + window.mj.checkWin(hand, ghost, melds) + '</p>');
  document.write('<p>checkWin(手牌+副露全放一起, 鬼): ' + window.mj.checkWin(hand.concat(['D9','D9','D9']), ghost) + '</p>');
  var r = window.mj.bestFanEx(hand, melds, ghost, 'zimo', 0, 0);
  document.write('<p>bestFanEx: fan=' + (r?r.fan:'null') + ' desc=' + (r?r.desc:'null') + '</p>');
</script>
</body></html>
