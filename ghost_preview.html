<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鬼牌扇形标记预览</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 5vh;
    background: radial-gradient(ellipse at 50% 45%, #17624b 0%, #0d3d2c 55%, #07271c 100%);
    font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }
  .tip { color: #e8d9a0; font-size: 2.6vh; letter-spacing: .12em; text-shadow: 0 0 .5vh #000; }
  .tip small { display: block; margin-top: 1vh; font-size: 1.8vh; color: #b98fd8; letter-spacing: .05em; }

  .row { display: flex; gap: 6vh; align-items: center; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 2.6vh; }
  .cell-label { color: #cfe6d8; font-size: 2vh; letter-spacing: .1em; }

  .stage { position: relative; display: inline-flex; }

  /* 游戏真实牌面 */
  .real-tile {
    height: 26vh; width: auto;
    display: block;
    border-radius: .8vh;
    box-shadow:
      inset 0 .22vh 0 rgba(255,255,255,.85),
      0 .32vh 0 0 #cdc6b2,
      0 .65vh .65vh rgba(0,0,0,.5);
  }

  /* 右上角贴合边角的扇形角标 */
  .corn-badge {
    position: absolute;
    top: 0; right: 0;
    width: 4.9vh; height: 4.9vh;
    display: block;
    z-index: 3;
    pointer-events: none;
  }
  .corn-badge .fan {
    fill: currentColor;           /* 用文字颜色控制 */
    stroke: rgba(255,255,255,.85);
    stroke-width: 1.1;
  }
  .corn-badge .tile-stroke { fill: none; stroke: rgba(255,255,255,.6); stroke-width: 1; }
  .corn-badge text {
    fill: #ffffff;
    font-family: "KaiTi","STKaiti","Kaiti SC","SimSun",serif;
    font-weight: 900;
  }
  .gb-green { color: #37b26a; }
  .gb-red   { color: #c0392b; }
</style>
</head>
<body>
  <div class="tip">鬼牌扇形标记</div>

  <div class="row">
    <!-- 手牌里的鬼牌：绿色扇形 -->
    <div class="cell">
      <div class="stage">
        <img class="real-tile" src="images/wan1.png" alt="手牌鬼牌">
        <svg class="corn-badge gb-green" viewBox="0 0 52 52" aria-hidden="true">
          <path class="fan" d="M 0 0 A 52 52 0 0 1 52 52 L 52 0 Z"/>
          <text x="17" y="26" font-size="15">鬼</text>
        </svg>
      </div>
      <div class="cell-label">手牌鬼牌 · 绿色扇形</div>
    </div>

    <!-- 中央鬼牌：红色扇形 -->
    <div class="cell">
      <div class="stage">
        <img class="real-tile" src="images/wan1.png" alt="中央鬼牌">
        <svg class="corn-badge gb-red" viewBox="0 0 52 52" aria-hidden="true">
          <path class="fan" d="M 0 0 A 52 52 0 0 1 52 52 L 52 0 Z"/>
          <text x="17" y="26" font-size="15">鬼</text>
        </svg>
      </div>
      <div class="cell-label">中央鬼牌 · 红色扇形</div>
    </div>
  </div>

  <div class="tip"><small>只是预览，游戏本身还没改动</small></div>
</body>
</html>
